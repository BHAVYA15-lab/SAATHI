services:
  - type: web
    name: saathi-backend
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./saarthi.db
      - key: CORS_ORIGINS
        value: "https://saathi-health.vercel.app,http://localhost:5173"
